[project]
name = "eduflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Vlad Spinul",email = "shinokakaov@mail.ru"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "stripe (>=15.3.1,<16.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "eventlet (>=0.41.1,<0.42.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipython (>=9.14.1,<10.0.0)",
    "coverage (>=7.15.2,<8.0.0)"
]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
